name: Fieldwork Fragment HostSingleton observer repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'teamleaderleo/react' &&
      github.event.pull_request.head.ref == 'repair/fragment-singleton-observer-ownership'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/fragment-singleton-observer-ownership
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Materialize narrow repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/fragment-singleton-observer-lifetime
          git checkout origin/research/fragment-singleton-observer-lifetime -- packages/react-dom/src/__tests__/ReactDOMFragmentRefsDocument-test.js
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'packages/react-dom-bindings/src/client/ReactFiberConfigDOM.js',
              '''export function deleteChildFromFragmentInstance(\n  childInstance: InstanceWithFragmentHandles | Text,\n  fragmentInstance: FragmentInstanceType,\n): void {''',
              '''export function deleteChildFromFragmentInstance(\n  childInstance: InstanceWithFragmentHandles | Text,\n  fragmentInstance: FragmentInstanceType,\n  unobserveObservers: boolean = false,\n): void {''',
          )

          replace_once(
              'packages/react-dom-bindings/src/client/ReactFiberConfigDOM.js',
              '''  if (eventListeners !== null) {\n    for (let i = 0; i < eventListeners.length; i++) {\n      const {type, listener, optionsOrUseCapture} = eventListeners[i];\n      instance.removeEventListener(type, listener, optionsOrUseCapture);\n    }\n  }\n  if (enableFragmentRefsInstanceHandles) {''',
              '''  if (eventListeners !== null) {\n    for (let i = 0; i < eventListeners.length; i++) {\n      const {type, listener, optionsOrUseCapture} = eventListeners[i];\n      instance.removeEventListener(type, listener, optionsOrUseCapture);\n    }\n  }\n  if (unobserveObservers && fragmentInstance._observers !== null) {\n    fragmentInstance._observers.forEach(observer => {\n      observer.unobserve(instance);\n    });\n  }\n  if (enableFragmentRefsInstanceHandles) {''',
          )

          replace_once(
              'packages/react-reconciler/src/ReactFiberCommitHostEffects.js',
              '''export function commitFragmentInstanceDeletionEffects(fiber: Fiber): void {''',
              '''export function commitFragmentInstanceDeletionEffects(\n  fiber: Fiber,\n  unobserveObservers: boolean = false,\n): void {''',
          )

          replace_once(
              'packages/react-reconciler/src/ReactFiberCommitHostEffects.js',
              '''      deleteChildFromFragmentInstance(fiber.stateNode, fragmentInstance);''',
              '''      deleteChildFromFragmentInstance(\n        fiber.stateNode,\n        fragmentInstance,\n        unobserveObservers,\n      );''',
          )

          replace_once(
              'packages/react-reconciler/src/ReactFiberCommitWork.js',
              '''        if (enableFragmentRefs) {\n          commitFragmentInstanceDeletionEffects(deletedFiber);\n        }\n\n        const prevHostParent = hostParent;''',
              '''        if (enableFragmentRefs) {\n          // HostSingleton DOM nodes survive Fiber deletion, so unlike ordinary\n          // host children there is no later DOM removal for an observer to\n          // report. End the old Fragment's observer ownership explicitly.\n          commitFragmentInstanceDeletionEffects(deletedFiber, true);\n        }\n\n        const prevHostParent = hostParent;''',
          )

          test_path = Path('packages/react-dom/src/__tests__/ReactDOMFragmentRefsDocument-test.js')
          text = test_path.read_text()
          needle = '''      expect(observer.unobserve).toHaveBeenCalledWith(\n        document.documentElement,\n      );\n    });\n  });'''
          replacement = '''      expect(observer.unobserve).toHaveBeenCalledWith(\n        document.documentElement,\n      );\n\n      await act(() => {\n        root.render(<Test showShell={true} />);\n      });\n      expect(observer.observe).toHaveBeenCalledTimes(2);\n      expect(observer.observe).toHaveBeenLastCalledWith(\n        document.documentElement,\n      );\n    });\n\n    // @gate enableFragmentRefs\n    it('keeps ordinary removed host children observed for removal reporting', async () => {\n      const fragmentRef = React.createRef();\n      const container = document.createElement('div');\n      const root = ReactDOMClient.createRoot(container);\n\n      function Test({showChild}) {\n        return (\n          <Fragment ref={fragmentRef}>\n            {showChild && <div id="ordinary-child" />}\n          </Fragment>\n        );\n      }\n\n      await act(() => {\n        root.render(<Test showChild={true} />);\n      });\n      const child = container.firstChild;\n      const observer = {\n        observe: jest.fn(),\n        unobserve: jest.fn(),\n      };\n      fragmentRef.current.observeUsing(observer);\n      expect(observer.observe).toHaveBeenCalledWith(child);\n\n      await act(() => {\n        root.render(<Test showChild={false} />);\n      });\n\n      // Ordinary children retain the established observer behavior: React\n      // does not unobserve them eagerly, so a real IntersectionObserver can\n      // report the DOM removal with an empty rect.\n      expect(observer.unobserve).not.toHaveBeenCalled();\n    });\n  });'''
          if text.count(needle) != 1:
              raise SystemExit(f'test insertion anchor count: {text.count(needle)}')
          test_path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Focused dev and prod tests
        run: |
          yarn test --dev ReactDOMFragmentRefsDocument-test
          yarn test --prod ReactDOMFragmentRefsDocument-test

      - name: Lint changed source
        run: yarn linc

      - name: Publish workflow-free internal source head
        shell: bash
        run: |
          set -euo pipefail
          rm -f .fieldwork-fragment-singleton-observer-repair
          rm -f .github/workflows/fieldwork-fragment-singleton-observer-repair.yml
          git diff --check
          git status --short
          git config user.name 'fieldwork-bot'
          git config user.email 'fieldwork-bot@users.noreply.github.com'
          git add packages/react-dom-bindings/src/client/ReactFiberConfigDOM.js \
                  packages/react-reconciler/src/ReactFiberCommitHostEffects.js \
                  packages/react-reconciler/src/ReactFiberCommitWork.js \
                  packages/react-dom/src/__tests__/ReactDOMFragmentRefsDocument-test.js \
                  .fieldwork-fragment-singleton-observer-repair \
                  .github/workflows/fieldwork-fragment-singleton-observer-repair.yml
          git commit -m 'Fix Fragment observer cleanup for HostSingleton deletion'
          git push origin HEAD:repair/fragment-singleton-observer-ownership
