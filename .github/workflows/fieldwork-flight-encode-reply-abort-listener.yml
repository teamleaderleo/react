name: Fieldwork Flight encodeReply abort listener repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.repository == 'teamleaderleo/react' && github.event.pull_request.head.ref == 'repair/flight-encode-reply-abort-listener'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Materialize repair and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(form_field_line, resolve_name='resolve', reject_name='reject'):
              return '\n'.join([
                  '  return new Promise((resolve, reject) => {',
                  '    const abort = processReply(',
                  '      value,',
                  form_field_line,
                  '      options && options.temporaryReferences',
                  '        ? options.temporaryReferences',
                  '        : undefined,',
                  f'      {resolve_name},',
                  f'      {reject_name},',
                  '    );',
                  '    if (options && options.signal) {',
                  '      const signal = options.signal;',
                  '      if (signal.aborted) {',
                  '        abort((signal as any).reason);',
                  '      } else {',
                  '        const listener = () => {',
                  '          abort((signal as any).reason);',
                  "          signal.removeEventListener('abort', listener);",
                  '        };',
                  "        signal.addEventListener('abort', listener);",
                  '      }',
                  '    }',
                  '  });',
              ])

          def replacement(form_field_line):
              return '\n'.join([
                  '  return new Promise((resolve, reject) => {',
                  '    const signal = options && options.signal;',
                  '    let listener: null | (() => void) = null;',
                  '    let settled = false;',
                  '',
                  '    const cleanup = () => {',
                  '      if (listener !== null && signal !== undefined) {',
                  "        signal.removeEventListener('abort', listener);",
                  '        listener = null;',
                  '      }',
                  '    };',
                  '    const resolveWithCleanup = (body: string | FormData) => {',
                  '      settled = true;',
                  '      cleanup();',
                  '      resolve(body);',
                  '    };',
                  '    const rejectWithCleanup = (error: mixed) => {',
                  '      settled = true;',
                  '      cleanup();',
                  '      reject(error);',
                  '    };',
                  '',
                  '    const abort = processReply(',
                  '      value,',
                  form_field_line,
                  '      options && options.temporaryReferences',
                  '        ? options.temporaryReferences',
                  '        : undefined,',
                  '      resolveWithCleanup,',
                  '      rejectWithCleanup,',
                  '    );',
                  '    if (signal !== undefined) {',
                  '      if (signal.aborted) {',
                  '        abort((signal as any).reason);',
                  '      } else if (!settled) {',
                  '        listener = () => {',
                  '          cleanup();',
                  '          abort((signal as any).reason);',
                  '        };',
                  "        signal.addEventListener('abort', listener);",
                  '      }',
                  '    }',
                  '  });',
              ])

          canonical_old = block("      '',")
          canonical_new = replacement("      '',")
          parcel_old = block("      '', // formFieldPrefix")
          parcel_new = replacement("      '', // formFieldPrefix")

          candidates = []
          canonical_targets = []
          parcel_targets = []
          for path in sorted(Path('packages').glob('react-*/src/client/ReactFlightDOMClient*.js')):
              text = path.read_text()
              if 'function encodeReply(' not in text:
                  continue
              candidates.append(path)
              if canonical_old in text:
                  canonical_targets.append(path)
              elif parcel_old in text:
                  parcel_targets.append(path)

          if len(candidates) != 9:
              raise SystemExit(f'expected exactly 9 encodeReply wrappers, found {len(candidates)}: {candidates}')
          if len(canonical_targets) != 8 or len(parcel_targets) != 1:
              raise SystemExit(
                  f'expected 8 canonical + 1 Parcel wrapper; canonical={canonical_targets}, parcel={parcel_targets}'
              )
          expected_parcel = Path('packages/react-server-dom-parcel/src/client/ReactFlightDOMClientBrowser.js')
          if parcel_targets != [expected_parcel]:
              raise SystemExit(f'unexpected Parcel variant owner: {parcel_targets}')

          for path in canonical_targets:
              text = path.read_text()
              if text.count(canonical_old) != 1:
                  raise SystemExit(f'unexpected canonical block count in {path}: {text.count(canonical_old)}')
              path.write_text(text.replace(canonical_old, canonical_new))

          text = expected_parcel.read_text()
          if text.count(parcel_old) != 1:
              raise SystemExit(f'unexpected Parcel block count: {text.count(parcel_old)}')
          expected_parcel.write_text(text.replace(parcel_old, parcel_new))

          test_path = Path('packages/react-server-dom-webpack/src/__tests__/ReactFlightDOMReply-test.js')
          text = test_path.read_text()
          anchor = "  it('can pass undefined as a reply', async () => {\n"
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor changed')
          tests = '\n'.join([
              "  it('does not subscribe an AbortSignal after a synchronous reply has settled', async () => {",
              '    const listeners = new Set();',
              '    let addCount = 0;',
              '    const signal = {',
              '      aborted: false,',
              '      reason: undefined,',
              '      addEventListener(type, listener) {',
              "        expect(type).toBe('abort');",
              '        addCount++;',
              '        listeners.add(listener);',
              '      },',
              '      removeEventListener(type, listener) {',
              "        expect(type).toBe('abort');",
              '        listeners.delete(listener);',
              '      },',
              '    };',
              '',
              "    await ReactServerDOMClient.encodeReply({hello: 'world'}, {",
              '      signal: (signal: any),',
              '    });',
              '',
              '    expect(addCount).toBe(0);',
              '    expect(listeners.size).toBe(0);',
              '  });',
              '',
              "  it('removes the AbortSignal listener after an asynchronous reply settles', async () => {",
              '    const listeners = new Set();',
              '    const signal = {',
              '      aborted: false,',
              '      reason: undefined,',
              '      addEventListener(type, listener) {',
              "        expect(type).toBe('abort');",
              '        listeners.add(listener);',
              '      },',
              '      removeEventListener(type, listener) {',
              "        expect(type).toBe('abort');",
              '        listeners.delete(listener);',
              '      },',
              '    };',
              '    let resolve;',
              '    const pending = new Promise(r => {',
              '      resolve = r;',
              '    });',
              '',
              '    const bodyPromise = ReactServerDOMClient.encodeReply(',
              '      {pending},',
              '      {signal: (signal: any)},',
              '    );',
              '    expect(listeners.size).toBe(1);',
              '',
              "    resolve('done');",
              '    await bodyPromise;',
              '    expect(listeners.size).toBe(0);',
              '  });',
              '',
              '',
          ])
          test_path.write_text(text.replace(anchor, tests + anchor))
          PY
      - name: Focused reply tests
        run: yarn test ReactFlightDOMReply-test
      - name: Changed-file lint
        run: yarn linc
      - name: Commit validated source packet
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/workflows/fieldwork-flight-encode-reply-abort-listener.yml
          git config user.name fieldwork-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages .github/workflows/fieldwork-flight-encode-reply-abort-listener.yml
          git commit -m "Fix Flight encodeReply abort listener cleanup"
          git push origin "HEAD:${BRANCH}"
