name: Fieldwork HostSingleton ownership and content reset

on:
  pull_request:
    branches:
      - repair/host-singleton-content-reset
  workflow_dispatch:

concurrency:
  group: fieldwork-host-singleton-ownership
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  current-content-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight regression matrix
        run: git apply --check fieldwork/host-singleton-content-reset-regression-matrix.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply regression matrix
        run: git apply fieldwork/host-singleton-content-reset-regression-matrix.patch
      - name: Run current candidate against matrix
        run: yarn test --dev ReactDOMSingletonComponents-test

  prechild-direct-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight candidate and matrix
        run: |
          git apply --check fieldwork/host-singleton-content-reset-prechild-direct-html.patch
          git apply --check fieldwork/host-singleton-content-reset-regression-matrix.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply candidate and matrix
        run: |
          git apply fieldwork/host-singleton-content-reset-prechild-direct-html.patch
          git apply fieldwork/host-singleton-content-reset-regression-matrix.patch
      - name: Run focused dev suite
        run: yarn test --dev ReactDOMSingletonComponents-test
      - name: Run focused prod suite
        run: yarn test --prod ReactDOMSingletonComponents-test
      - name: Run lint gate
        run: yarn linc

  offscreen-ownership-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight ownership controls
        run: git apply --check fieldwork/host-singleton-offscreen-ownership.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply ownership controls
        run: git apply fieldwork/host-singleton-offscreen-ownership.patch
      - name: Run current ownership behavior
        run: yarn test --dev ReactDOMSingletonComponents-test

  offscreen-ownership-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight ownership repair
        run: |
          git apply --check fieldwork/host-singleton-offscreen-ownership-repair.patch
          git apply --check fieldwork/host-singleton-offscreen-ownership.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply ownership repair and controls
        run: |
          git apply fieldwork/host-singleton-offscreen-ownership-repair.patch
          git apply fieldwork/host-singleton-offscreen-ownership.patch
      - name: Run focused dev suite
        run: yarn test --dev ReactDOMSingletonComponents-test
      - name: Run focused prod suite
        run: yarn test --prod ReactDOMSingletonComponents-test
      - name: Run lint gate
        run: yarn linc

  promote-clean-source:
    needs: prechild-direct-html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification packet
        uses: actions/checkout@v4
        with:
          path: verification
      - name: Checkout exact clean source branch
        uses: actions/checkout@v4
        with:
          ref: repair/host-singleton-content-reset
          path: source
          fetch-depth: 0
      - name: Guard reviewed source head
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "ed2c1ade64d40761fade7998afe83be62d2d1239"
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
          cache: yarn
          cache-dependency-path: source/yarn.lock
      - name: Apply exact candidate and regression matrix
        working-directory: source
        run: |
          git apply --check ../verification/fieldwork/host-singleton-content-reset-prechild-direct-html.patch
          git apply ../verification/fieldwork/host-singleton-content-reset-prechild-direct-html.patch
          git apply --check ../verification/fieldwork/host-singleton-content-reset-regression-matrix.patch
          git apply ../verification/fieldwork/host-singleton-content-reset-regression-matrix.patch
      - name: Install dependencies
        working-directory: source
        run: yarn install --frozen-lockfile
      - name: Re-run focused dev suite
        working-directory: source
        run: yarn test --dev ReactDOMSingletonComponents-test
      - name: Re-run focused prod suite
        working-directory: source
        run: yarn test --prod ReactDOMSingletonComponents-test
      - name: Re-run lint gate
        working-directory: source
        run: yarn linc
      - name: Verify source-only diff
        working-directory: source
        run: |
          git diff --name-only | sort > /tmp/actual-files
          printf '%s\n' \
            packages/react-dom/src/__tests__/ReactDOMSingletonComponents-test.js \
            packages/react-reconciler/src/ReactFiberBeginWork.js \
            packages/react-reconciler/src/ReactFiberCommitHostEffects.js \
            packages/react-reconciler/src/ReactFiberCommitWork.js | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Commit refined source
        working-directory: source
        run: |
          git config user.name "teamleaderleo-fieldwork"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add packages/react-dom/src/__tests__/ReactDOMSingletonComponents-test.js \
            packages/react-reconciler/src/ReactFiberBeginWork.js \
            packages/react-reconciler/src/ReactFiberCommitHostEffects.js \
            packages/react-reconciler/src/ReactFiberCommitWork.js
          git commit -m "fix: reset singleton direct HTML before child effects"
          git push origin HEAD:repair/host-singleton-content-reset
