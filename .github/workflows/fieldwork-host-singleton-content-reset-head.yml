name: Fieldwork HostSingleton content reset scope test

on:
  pull_request:
    branches:
      - repair/host-singleton-content-reset
  workflow_dispatch:

concurrency:
  group: fieldwork-host-singleton-content-reset-head
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  head-and-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight head regression
        run: git apply --check fieldwork/host-singleton-content-reset-head.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply head regression
        run: git apply fieldwork/host-singleton-content-reset-head.patch
      - name: Run focused dev suite
        run: yarn test --dev ReactDOMSingletonComponents-test
      - name: Run focused prod suite
        run: yarn test --prod ReactDOMSingletonComponents-test
      - name: Run lint gate
        run: yarn linc

  body-only-counterfactual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight patches
        run: |
          git apply --check fieldwork/host-singleton-content-reset-body-only.patch
          git apply --check fieldwork/host-singleton-content-reset-head.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply body-only narrowing and head regression
        run: |
          git apply fieldwork/host-singleton-content-reset-body-only.patch
          git apply fieldwork/host-singleton-content-reset-head.patch
      - name: Run focused dev suite
        run: yarn test --dev ReactDOMSingletonComponents-test
