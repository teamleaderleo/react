name: Fieldwork HostSingleton content reset scope test

on:
  pull_request:
    branches:
      - repair/host-singleton-content-reset
  workflow_dispatch:

concurrency:
  group: fieldwork-host-singleton-content-reset-scope
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  current-head-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight regression
        run: git apply --check fieldwork/host-singleton-content-reset-head.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply regression
        run: git apply fieldwork/host-singleton-content-reset-head.patch
      - name: Run focused dev suite
        run: yarn test --dev ReactDOMSingletonComponents-test

  current-text-sibling-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight regression
        run: git apply --check fieldwork/host-singleton-content-reset-text-sibling.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply regression
        run: git apply fieldwork/host-singleton-content-reset-text-sibling.patch
      - name: Run focused dev suite
        run: yarn test --dev ReactDOMSingletonComponents-test

  current-html-to-text-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight regression
        run: git apply --check fieldwork/host-singleton-content-reset-html-to-text.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply regression
        run: git apply fieldwork/host-singleton-content-reset-html-to-text.patch
      - name: Run focused dev suite
        run: yarn test --dev ReactDOMSingletonComponents-test

  prechild-direct-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight repair and regressions
        run: |
          git apply --check fieldwork/host-singleton-content-reset-prechild-direct-html.patch
          git apply --check fieldwork/host-singleton-content-reset-head.patch
          git apply --check fieldwork/host-singleton-content-reset-text-sibling.patch
          git apply --check fieldwork/host-singleton-content-reset-html-to-text.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply repair and regressions
        run: |
          git apply fieldwork/host-singleton-content-reset-prechild-direct-html.patch
          git apply fieldwork/host-singleton-content-reset-head.patch
          git apply fieldwork/host-singleton-content-reset-text-sibling.patch
          git apply fieldwork/host-singleton-content-reset-html-to-text.patch
      - name: Run focused dev suite
        run: yarn test --dev ReactDOMSingletonComponents-test
      - name: Run focused prod suite
        run: yarn test --prod ReactDOMSingletonComponents-test
      - name: Run lint gate
        run: yarn linc
