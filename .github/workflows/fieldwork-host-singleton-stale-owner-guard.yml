name: Fieldwork HostSingleton stale owner guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale-owner-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight experiment and Suspense contract
        run: |
          git apply --check fieldwork/host-singleton-stale-owner-guard.patch
          git apply --check fieldwork/host-singleton-suspense-stale-owner-contract.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply public Suspense ownership contract only
        run: git apply fieldwork/host-singleton-suspense-stale-owner-contract.patch
      - name: Require current source to reproduce stale-owner overwrite
        shell: bash
        run: |
          set -u
          pattern="does not let a suspended primary body overwrite the visible fallback owner"
          if yarn test --dev ReactDOM-test --testNamePattern="$pattern"; then
            echo "Current source unexpectedly passed the public Suspense stale-owner control."
            exit 1
          fi
      - name: Apply stale-owner containment experiment
        run: git apply fieldwork/host-singleton-stale-owner-guard.patch
      - name: Require public Suspense stale-owner control to pass in development
        run: >-
          yarn test --dev ReactDOM-test
          --testNamePattern="does not let a suspended primary body overwrite the visible fallback owner"
      - name: Require public Suspense stale-owner control to pass in production
        run: >-
          yarn test --prod ReactDOM-test
          --testNamePattern="does not let a suspended primary body overwrite the visible fallback owner"
      - name: Existing Suspense document fallback regression
        run: >-
          yarn test --dev ReactDOM-test
          --testNamePattern="can render a Suspense boundary above the <html> tag"
      - name: DOM Flow
        run: yarn flow dom-browser
      - name: Diff hygiene
        run: git diff --check
