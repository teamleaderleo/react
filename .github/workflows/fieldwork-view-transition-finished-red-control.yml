name: Fieldwork ViewTransition finished red control

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  focused-red-control:
    if: >-
      github.repository == 'teamleaderleo/react' &&
      github.event.pull_request.head.ref == 'research/view-transition-finished-unhandled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/view-transition-finished-unhandled
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Focused ViewTransition finished cleanup regression
        run: yarn test --dev ReactDOMViewTransitionFinishedCleanup-test --runInBand
