name: (Shared) Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  TZ: /usr/share/zoneinfo/America/Los_Angeles
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1

jobs:
  prettier:
    name: Run prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Cache node_modules
        uses: actions/cache@v4
        id: node_modules
        with:
          path: |
            **/node_modules
          key: shared-lint-node_modules-v7-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Ensure clean build directory
        run: rm -rf build
      - run: yarn install --frozen-lockfile
        if: steps.node_modules.outputs.cache-hit != 'true'
      - name: Require current source to reproduce Document dispatch failure
        shell: bash
        run: |
          if yarn test --dev ReactDOMFragmentRefsDocumentDispatch-test --runInBand; then
            echo "Current source unexpectedly passed the Document dispatch control."
            exit 1
          fi
      - name: Apply Document-safe dispatch experiment and strengthen controls
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('packages/react-dom-bindings/src/client/ReactFiberConfigDOM.js')
          text = source.read_text()
          old = "    const temp = document.createTextNode('');"
          new = """    const temp =
      parentHostInstance.nodeType === DOCUMENT_NODE
        ? (parentHostInstance as Document).createComment('')
        : document.createTextNode('');"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one synthetic text target, found {text.count(old)}')
          source.write_text(text.replace(old, new, 1))

          test = Path('packages/react-dom/src/__tests__/ReactDOMFragmentRefsDocumentDispatch-test.js')
          text = test.read_text()
          old = """    const fragmentListener = jest.fn();
    const documentListener = jest.fn();
    fragmentRef.current.addEventListener('custom', fragmentListener);
    document.addEventListener('custom', documentListener);

    const result = fragmentRef.current.dispatchEvent(
      new Event('custom', {bubbles: true, cancelable: true}),
    );

    expect(result).toBe(true);
    expect(fragmentListener).toHaveBeenCalledTimes(1);
    expect(documentListener).toHaveBeenCalledTimes(1);"""
          new = """    const fragmentListener = jest.fn();
    const documentListener = jest.fn();
    fragmentRef.current.addEventListener('custom', fragmentListener);
    document.addEventListener('custom', documentListener);
    const childCountBeforeDispatch = document.childNodes.length;

    const result = fragmentRef.current.dispatchEvent(
      new Event('custom', {bubbles: true, cancelable: true}),
    );

    expect(result).toBe(true);
    expect(fragmentListener).toHaveBeenCalledTimes(1);
    expect(documentListener).toHaveBeenCalledTimes(1);
    expect(document.childNodes.length).toBe(childCountBeforeDispatch);

    const preventingListener = jest.fn(event => event.preventDefault());
    fragmentRef.current.addEventListener('prevented', preventingListener);
    const prevented = fragmentRef.current.dispatchEvent(
      new Event('prevented', {bubbles: true, cancelable: true}),
    );
    expect(prevented).toBe(false);
    expect(preventingListener).toHaveBeenCalledTimes(1);
    expect(document.childNodes.length).toBe(childCountBeforeDispatch);"""
          if text.count(old) != 1:
              raise SystemExit('expected one Document dispatch assertion block')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Focused development controls
        run: >-
          yarn test --dev
          ReactDOMFragmentRefsDocumentDispatch-test
          ReactDOMFragmentRefs-test
          --runInBand
      - name: Focused production controls
        run: >-
          yarn test --prod
          ReactDOMFragmentRefsDocumentDispatch-test
          ReactDOMFragmentRefs-test
          --runInBand
      - name: DOM Flow
        run: yarn flow dom-browser
      - name: Diff hygiene
        run: git diff --check
      - name: Formatter
        run: yarn prettier-check

  eslint:
    name: Run eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore cached node_modules
        uses: actions/cache/restore@v4
        id: node_modules
        with:
          path: |
            **/node_modules
          key: shared-lint-node_modules-v7-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Ensure clean build directory
        run: rm -rf build
      - run: yarn install --frozen-lockfile
        if: steps.node_modules.outputs.cache-hit != 'true'
      - run: node ./scripts/tasks/eslint

  check_license:
    name: Check license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Cache node_modules
        uses: actions/cache@v4
        id: node_modules
        with:
          path: |
            **/node_modules
          key: shared-lint-node_modules-v7-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Ensure clean build directory
        run: rm -rf build
      - run: yarn install --frozen-lockfile
        if: steps.node_modules.outputs.cache-hit != 'true'
      - run: ./scripts/ci/check_license.sh

  test_print_warnings:
    name: Test print warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Cache node_modules
        uses: actions/cache@v4
        id: node_modules
        with:
          path: |
            **/node_modules
          key: shared-lint-node_modules-v7-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Ensure clean build directory
        run: rm -rf build
      - run: yarn install --frozen-lockfile
        if: steps.node_modules.outputs.cache-hit != 'true'
      - run: ./scripts/ci/test_print_warnings.sh
