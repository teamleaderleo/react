name: Fieldwork Fragment listener registry current-main verifier

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  verify-repair:
    if: >-
      github.repository == 'teamleaderleo/react' &&
      github.event.pull_request.head.ref == 'verify/fragment-listener-registry-current-main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/fragment-listener-registry-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Apply listener identity and unknown-removal repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/react-dom-bindings/src/client/ReactFiberConfigDOM.js')
          text = path.read_text()

          old = """  if (typeof listeners !== 'undefined' && listeners.length > 0) {\n    traverseFragmentInstancesAndTextInstances(\n      this._fragmentFiber,\n      removeEventListenerFromChild,\n      type,\n      listener,\n      optionsOrUseCapture,\n    );\n    const index = indexOfEventListener(\n      listeners,\n      type,\n      listener,\n      optionsOrUseCapture,\n    );\n    if (this._eventListeners !== null) {\n      this._eventListeners.splice(index, 1);\n    }\n  }\n"""
          new = """  if (typeof listeners !== 'undefined' && listeners.length > 0) {\n    const index = indexOfEventListener(\n      listeners,\n      type,\n      listener,\n      optionsOrUseCapture,\n    );\n    if (index === -1) {\n      return;\n    }\n    traverseFragmentInstancesAndTextInstances(\n      this._fragmentFiber,\n      removeEventListenerFromChild,\n      type,\n      listener,\n      optionsOrUseCapture,\n    );\n    if (this._eventListeners !== null) {\n      this._eventListeners.splice(index, 1);\n    }\n  }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one Fragment removeEventListener block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  if (opts == null) {\n    return '0';\n  }\n"""
          new = """  if (opts == null) {\n    return 'c=0';\n  }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one null listener-options normalization, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Focused Fragment listener controls in development
        run: >-
          yarn test --dev
          ReactDOMFragmentRefsEventRegistry-test
          ReactDOMFragmentRefs-test
          --runInBand
      - name: Focused Fragment listener controls in production
        run: >-
          yarn test --prod
          ReactDOMFragmentRefsEventRegistry-test
          ReactDOMFragmentRefs-test
          --runInBand
      - name: Diff hygiene
        run: git diff --check
      - name: Prepare formatter base ref
        run: |
          git fetch origin main:refs/remotes/origin/main
          git branch -f main origin/main
      - name: Format check
        run: >-
          yarn prettier
          packages/react-dom-bindings/src/client/ReactFiberConfigDOM.js
          packages/react-dom/src/__tests__/ReactDOMFragmentRefsEventRegistry-test.js
          --check
