name: Fieldwork Fragment event-registry normalization

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'teamleaderleo/react' &&
      github.event.pull_request.head.ref == 'repair/fragment-remove-unregistered-listener'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/fragment-remove-unregistered-listener
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Materialize capture-false normalization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main research/fragment-remove-unregistered-listener
          git branch -f main origin/main
          git checkout origin/research/fragment-remove-unregistered-listener -- packages/react-dom/src/__tests__/ReactDOMFragmentRefsEventRegistry-test.js
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/react-dom-bindings/src/client/ReactFiberConfigDOM.js')
          text = path.read_text()
          old = '''function normalizeListenerOptions(\n  opts: ?EventListenerOptionsOrUseCapture,\n): string {\n  if (opts == null) {\n    return '0';\n  }'''
          new = '''function normalizeListenerOptions(\n  opts: ?EventListenerOptionsOrUseCapture,\n): string {\n  if (opts == null) {\n    return 'c=0';\n  }'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one listener-options normalization block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Focused DEV and PROD controls
        run: |
          yarn test --dev ReactDOMFragmentRefsEventRegistry-test ReactDOMFragmentRefs-test --runInBand
          yarn test --prod ReactDOMFragmentRefsEventRegistry-test ReactDOMFragmentRefs-test --runInBand
      - name: Lint changed source
        run: yarn linc

      - name: Publish workflow-free two-file packet
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fieldwork-fragment-event-registry-normalize.yml
          git diff --check
          git config user.name 'fieldwork-bot'
          git config user.email 'fieldwork-bot@users.noreply.github.com'
          git add packages/react-dom-bindings/src/client/ReactFiberConfigDOM.js \
                  packages/react-dom/src/__tests__/ReactDOMFragmentRefsEventRegistry-test.js \
                  .github/workflows/fieldwork-fragment-event-registry-normalize.yml
          git commit -m 'Fix Fragment listener identity bookkeeping'
          git push origin HEAD:repair/fragment-remove-unregistered-listener
