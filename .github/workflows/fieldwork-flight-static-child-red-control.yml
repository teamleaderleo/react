name: Fieldwork Flight static-child row deferral red control

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  focused-red-control:
    if: >-
      github.repository == 'teamleaderleo/react' &&
      github.event.pull_request.head.ref == 'research/flight-static-child-outline-key-warning'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/flight-static-child-outline-key-warning
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Focused Flight DEV regression
        run: yarn test --dev ReactFlightStaticChildKeyValidation-test --runInBand
