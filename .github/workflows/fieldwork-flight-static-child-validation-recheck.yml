name: Fieldwork Flight static-child validation recheck

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: >-
      github.repository == 'teamleaderleo/react' &&
      github.event.pull_request.head.ref == 'repair/flight-static-child-validation-deferral'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/flight-static-child-validation-deferral
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: git fetch origin main && git branch -f main origin/main
      - name: Focused DEV validation controls
        run: yarn test --dev ReactFlightStaticChildKeyValidation-test --runInBand
      - name: Existing blocked-child control
        run: yarn test --dev ReactFlightDOMBrowser-test -t 'static child is blocked on debug info' --runInBand
      - name: Lint changed source
        run: yarn linc
      - name: Remove verification workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fieldwork-flight-static-child-validation-recheck.yml
          git diff --check
          git config user.name 'fieldwork-bot'
          git config user.email 'fieldwork-bot@users.noreply.github.com'
          git add packages/react-server-dom-webpack/src/__tests__/ReactFlightStaticChildKeyValidation-test.js \
                  .github/workflows/fieldwork-flight-static-child-validation-recheck.yml
          git commit -m 'test: retain genuine Flight missing-key warnings'
          git push origin HEAD:repair/flight-static-child-validation-deferral
