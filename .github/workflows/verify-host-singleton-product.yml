name: Verify HostSingleton product packet

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'teamleaderleo/react' && github.event.pull_request.head.ref == 'repair/host-singleton-content-reset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Add head and html safety controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/react-dom/src/__tests__/ReactDOMSingletonComponents-test.js')
          text = path.read_text()
          anchor = "  it('updates dangerouslySetInnerHTML on a singleton', async () => {\n"
          if text.count(anchor) != 1:
            raise SystemExit('test anchor changed')
          tests = """  it('replaces dangerouslySetInnerHTML with children in head', async () => {
    const root = ReactDOMClient.createRoot(document);
    const head = document.head;

    root.render(
      <html>
        <head dangerouslySetInnerHTML={{__html: '<title>old</title>'}} />
        <body />
      </html>,
    );
    await waitForAll([]);
    expect(head.innerHTML).toBe('<title>old</title>');

    root.render(
      <html>
        <head>
          <title>new</title>
        </head>
        <body />
      </html>,
    );
    await waitForAll([]);

    expect(document.head).toBe(head);
    expect(head.innerHTML).toBe('<title>new</title>');
  });

  it('replaces dangerouslySetInnerHTML with singleton children in html', async () => {
    const root = ReactDOMClient.createRoot(document);
    const html = document.documentElement;

    root.render(
      <html
        dangerouslySetInnerHTML={{
          __html: '<head><title>old</title></head><body><main>old</main></body>',
        }}
      />,
    );
    await waitForAll([]);
    expect(document.title).toBe('old');
    expect(document.body.textContent).toBe('old');

    root.render(
      <html>
        <head>
          <title>new</title>
        </head>
        <body>
          <main>new</main>
        </body>
      </html>,
    );
    await waitForAll([]);

    expect(document.documentElement).toBe(html);
    expect(document.title).toBe('new');
    expect(document.body.textContent).toBe('new');
  });

"""
          path.write_text(text.replace(anchor, tests + anchor))
          PY
      - name: Development focused suite
        run: yarn test ReactDOMSingletonComponents-test
      - name: Production focused suite
        run: yarn test --prod ReactDOMSingletonComponents-test
      - name: DOM browser Flow
        run: yarn flow dom-browser
      - name: Restore clean product packet
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git checkout -- packages/react-dom/src/__tests__/ReactDOMSingletonComponents-test.js
          rm .github/workflows/verify-host-singleton-product.yml
          git config user.name fieldwork-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/verify-host-singleton-product.yml
          git commit -m "[internal] remove HostSingleton verification carrier"
          git push origin "HEAD:${BRANCH}"
