name: Fieldwork HostSingleton content reset repair

on:
  push:
    branches:
      - repair/host-singleton-content-reset
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'repair/host-singleton-content-reset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/host-singleton-content-reset
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Apply narrow HostSingleton repair
        run: |
          python <<'PY'
          from pathlib import Path

          begin = Path('packages/react-reconciler/src/ReactFiberBeginWork.js')
          text = begin.read_text()
          old = """function updateHostSingleton(\n  current: Fiber | null,\n  workInProgress: Fiber,\n  renderLanes: Lanes,\n) {\n  pushHostContext(workInProgress);\n\n  if (current === null) {\n    claimHydratableSingleton(workInProgress);\n  }\n\n  const nextChildren = workInProgress.pendingProps.children;\n  reconcileChildren(current, workInProgress, nextChildren, renderLanes);\n"""
          new = """function updateHostSingleton(\n  current: Fiber | null,\n  workInProgress: Fiber,\n  renderLanes: Lanes,\n) {\n  pushHostContext(workInProgress);\n\n  if (current === null) {\n    claimHydratableSingleton(workInProgress);\n  }\n\n  const nextProps = workInProgress.pendingProps;\n  const prevProps = current !== null ? current.memoizedProps : null;\n  const nextChildren = nextProps.children;\n\n  if (\n    prevProps !== null &&\n    shouldSetTextContent(workInProgress.type, prevProps) &&\n    !shouldSetTextContent(workInProgress.type, nextProps)\n  ) {\n    workInProgress.flags |= ContentReset;\n  }\n\n  reconcileChildren(current, workInProgress, nextChildren, renderLanes);\n"""
          if text.count(old) != 1:
            raise SystemExit(f'BeginWork target count: {text.count(old)}')
          begin.write_text(text.replace(old, new))

          host_effects = Path('packages/react-reconciler/src/ReactFiberCommitHostEffects.js')
          text = host_effects.read_text()
          old = """  let hostParentFiber;\n  let parentFragmentInstances = null;\n  let collectFragmentInstances = enableFragmentRefs;\n  let parentFiber = finishedWork.return;\n  while (parentFiber !== null) {\n"""
          new = """  let hostParentFiber;\n  let contentResetParent = null;\n  let parentFragmentInstances = null;\n  let collectFragmentInstances = enableFragmentRefs;\n  let parentFiber = finishedWork.return;\n  while (parentFiber !== null) {\n    if (\n      contentResetParent === null &&\n      supportsSingletons &&\n      parentFiber.tag === HostSingleton &&\n      parentFiber.flags & ContentReset\n    ) {\n      contentResetParent = parentFiber;\n    }\n"""
          if text.count(old) != 1:
            raise SystemExit(f'CommitHostEffects parent-search target count: {text.count(old)}')
          text = text.replace(old, new)
          old = """  if (hostParentFiber == null) {\n    throw new Error(\n      'Expected to find a host parent. This error is likely caused by a bug ' +\n        'in React. Please file an issue.',\n    );\n  }\n\n  switch (hostParentFiber.tag) {\n"""
          new = """  if (hostParentFiber == null) {\n    throw new Error(\n      'Expected to find a host parent. This error is likely caused by a bug ' +\n        'in React. Please file an issue.',\n    );\n  }\n\n  if (contentResetParent !== null) {\n    // HostSingletons outside a singleton placement scope (html/body) are\n    // skipped while finding the placement parent. Still clear their direct\n    // content before inserting the replacement child, just like HostComponent.\n    resetTextContent(contentResetParent.stateNode);\n    contentResetParent.flags &= ~ContentReset;\n    trackHostMutation();\n  }\n\n  switch (hostParentFiber.tag) {\n"""
          if text.count(old) != 1:
            raise SystemExit(f'CommitHostEffects insertion target count: {text.count(old)}')
          host_effects.write_text(text.replace(old, new))

          commit = Path('packages/react-reconciler/src/ReactFiberCommitWork.js')
          text = commit.read_text()
          old = """      if (supportsSingletons) {\n        recursivelyTraverseMutationEffects(root, finishedWork, lanes);\n        commitReconciliationEffects(finishedWork, lanes);\n        if (flags & Ref) {\n"""
          new = """      if (supportsSingletons) {\n        recursivelyTraverseMutationEffects(root, finishedWork, lanes);\n        commitReconciliationEffects(finishedWork, lanes);\n        if (finishedWork.flags & ContentReset) {\n          // If no child placement consumed the reset, clear stale direct\n          // content now. This covers transitions to empty content.\n          commitHostResetTextContent(finishedWork);\n          finishedWork.flags &= ~ContentReset;\n        }\n        if (flags & Ref) {\n"""
          if text.count(old) != 1:
            raise SystemExit(f'CommitWork HostSingleton target count: {text.count(old)}')
          commit.write_text(text.replace(old, new))

          tests = Path('packages/react-dom/src/__tests__/ReactDOMSingletonComponents-test.js')
          text = tests.read_text()
          names = [
            "clears dangerouslySetInnerHTML when it becomes undefined",
            "clears dangerouslySetInnerHTML when __html becomes undefined",
            "replaces dangerouslySetInnerHTML with singleton children",
          ]
          for name in names:
            old = f"  // @gate TODO\n  it('{name}',"
            new = f"  it('{name}',"
            if text.count(old) != 1:
              raise SystemExit(f'Test gate target {name!r} count: {text.count(old)}')
            text = text.replace(old, new)
          tests.write_text(text)

          Path('.github/workflows/fieldwork-host-singleton-repair.yml').unlink()
          PY
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run focused singleton tests
        run: yarn test ReactDOMSingletonComponents-test
      - name: Lint changed files
        run: yarn linc
      - name: Commit verified repair
        run: |
          git config user.name "fieldwork-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/react-reconciler/src/ReactFiberBeginWork.js \
                  packages/react-reconciler/src/ReactFiberCommitHostEffects.js \
                  packages/react-reconciler/src/ReactFiberCommitWork.js \
                  packages/react-dom/src/__tests__/ReactDOMSingletonComponents-test.js \
                  .github/workflows/fieldwork-host-singleton-repair.yml
          git commit -m "Fix HostSingleton content reset transitions"
          git push origin HEAD:repair/host-singleton-content-reset
