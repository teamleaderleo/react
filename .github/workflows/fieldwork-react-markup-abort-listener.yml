name: Fieldwork react-markup AbortSignal cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.repository == 'teamleaderleo/react' && github.event.pull_request.head.ref == 'repair/react-markup-abort-listener-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Materialize narrow cleanup repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch_source(path_name, reject_count):
              path = Path(path_name)
              text = path.read_text()
              start = """  return new Promise((resolve, reject) => {\n"""
              replacement = """  return new Promise((resolve, reject) => {\n    const signal = options && options.signal;\n    let listener: null | (() => void) = null;\n\n    const cleanup = () => {\n      if (listener !== null && signal !== undefined) {\n        signal.removeEventListener('abort', listener);\n        listener = null;\n      }\n    };\n    const resolveWithCleanup = (html: string) => {\n      cleanup();\n      resolve(html);\n    };\n    const rejectWithCleanup = (error: mixed) => {\n      cleanup();\n      reject(error);\n    };\n"""
              if text.count(start) != 1:
                  raise SystemExit(f'{path}: Promise executor anchor count {text.count(start)}')
              text = text.replace(start, replacement, 1)
              if text.count('          resolve(buffer);') != 1:
                  raise SystemExit(f'{path}: resolve(buffer) count {text.count("          resolve(buffer);")}')
              text = text.replace('          resolve(buffer);', '          resolveWithCleanup(buffer);')
              if text.count('        reject(error);') != reject_count:
                  raise SystemExit(f'{path}: reject(error) count {text.count("        reject(error);")} != {reject_count}')
              text = text.replace('        reject(error);', '        rejectWithCleanup(error);')
              old_signal = """    if (options && options.signal) {\n      const signal = options.signal;\n      if (signal.aborted) {\n"""
              new_signal = """    if (signal !== undefined) {\n      if (signal.aborted) {\n"""
              if text.count(old_signal) != 1:
                  raise SystemExit(f'{path}: signal anchor count {text.count(old_signal)}')
              text = text.replace(old_signal, new_signal)
              old_listener = """        const listener = () => {\n"""
              new_listener = """        listener = () => {\n          cleanup();\n"""
              if text.count(old_listener) != 1:
                  raise SystemExit(f'{path}: listener anchor count {text.count(old_listener)}')
              text = text.replace(old_listener, new_listener)
              remove_line = "          signal.removeEventListener('abort', listener);\n"
              if text.count(remove_line) != 1:
                  raise SystemExit(f'{path}: old listener cleanup count {text.count(remove_line)}')
              text = text.replace(remove_line, '')
              path.write_text(text)

          patch_source('packages/react-markup/src/ReactMarkupClient.js', 2)
          patch_source('packages/react-markup/src/ReactMarkupServer.js', 3)

          client_test = Path('packages/react-markup/src/__tests__/ReactMarkupClient-test.js')
          text = client_test.read_text()
          anchor = "    it('should be able to render a simple component', async () => {\n"
          if text.count(anchor) != 1:
              raise SystemExit('client test anchor changed')
          tests = """    it('releases the AbortSignal listener after a successful render', async () => {
      const listeners = new Set();
      const signal = {
        aborted: false,
        reason: undefined,
        addEventListener(type, listener) {
          expect(type).toBe('abort');
          listeners.add(listener);
        },
        removeEventListener(type, listener) {
          expect(type).toBe('abort');
          listeners.delete(listener);
        },
      };

      await ReactMarkup.experimental_renderToHTML(<div>hello</div>, {
        signal: (signal: any),
      });
      expect(listeners.size).toBe(0);
    });

    it('releases the AbortSignal listener after a render error', async () => {
      const listeners = new Set();
      const signal = {
        aborted: false,
        reason: undefined,
        addEventListener(type, listener) {
          expect(type).toBe('abort');
          listeners.add(listener);
        },
        removeEventListener(type, listener) {
          expect(type).toBe('abort');
          listeners.delete(listener);
        },
      };
      const error = new Error('markup failed');
      function Throws() {
        throw error;
      }

      await expect(
        ReactMarkup.experimental_renderToHTML(<Throws />, {
          signal: (signal: any),
        }),
      ).rejects.toBe(error);
      expect(listeners.size).toBe(0);
    });

"""
          client_test.write_text(text.replace(anchor, tests + anchor))

          server_test = Path('packages/react-markup/src/__tests__/ReactMarkupServer-test.js')
          text = server_test.read_text()
          anchor = "    it('should be able to render a simple component', async () => {\n"
          if text.count(anchor) != 1:
              raise SystemExit('server test anchor changed')
          tests = """    it('releases the AbortSignal listener after a successful render', async () => {
      const listeners = new Set();
      const signal = {
        aborted: false,
        reason: undefined,
        addEventListener(type, listener) {
          expect(type).toBe('abort');
          listeners.add(listener);
        },
        removeEventListener(type, listener) {
          expect(type).toBe('abort');
          listeners.delete(listener);
        },
      };

      await ReactMarkup.experimental_renderToHTML(
        React.createElement('div', null, 'hello'),
        {signal: (signal: any)},
      );
      expect(listeners.size).toBe(0);
    });

    it('releases the AbortSignal listener after a render error', async () => {
      const listeners = new Set();
      const signal = {
        aborted: false,
        reason: undefined,
        addEventListener(type, listener) {
          expect(type).toBe('abort');
          listeners.add(listener);
        },
        removeEventListener(type, listener) {
          expect(type).toBe('abort');
          listeners.delete(listener);
        },
      };
      const error = new Error('markup failed');
      function Throws() {
        throw error;
      }

      await expect(
        ReactMarkup.experimental_renderToHTML(React.createElement(Throws), {
          signal: (signal: any),
        }),
      ).rejects.toBe(error);
      expect(listeners.size).toBe(0);
    });

"""
          server_test.write_text(text.replace(anchor, tests + anchor))
          PY
      - name: Development markup suites
        run: yarn test ReactMarkupClient-test ReactMarkupServer-test
      - name: Production markup suites
        run: yarn test --prod ReactMarkupClient-test ReactMarkupServer-test
      - name: Markup Flow
        run: yarn flow markup
      - name: Changed-file lint
        run: |
          git branch main origin/main
          yarn linc
      - name: Commit validated source packet
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/workflows/fieldwork-react-markup-abort-listener.yml
          git config user.name fieldwork-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/react-markup .github/workflows/fieldwork-react-markup-abort-listener.yml
          git commit -m "Clean up react-markup AbortSignal listeners"
          git push origin "HEAD:${BRANCH}"
