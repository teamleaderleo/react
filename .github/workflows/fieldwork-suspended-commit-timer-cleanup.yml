name: Fieldwork suspended commit timer cleanup

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-suspended-commit-timers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run focused timer ownership controls
        run: yarn test --dev ReactDOMSuspendedCommitTimerCleanup-test --runInBand
      - name: DOM Flow
        run: yarn flow dom-browser
      - name: Diff hygiene
        run: git diff --check
