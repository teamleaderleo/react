name: Fieldwork HostSingleton opaque range contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-source-contract-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight contract patches
        run: |
          git apply --check fieldwork/host-singleton-opaque-range-contract.patch
          git apply --check fieldwork/host-singleton-suspense-opaque-fallback-contract.patch
          git apply --check fieldwork/host-singleton-body-scope-sibling-contract.patch
          git apply --check fieldwork/host-singleton-opaque-parser-compat.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply contract tests only
        run: |
          git apply fieldwork/host-singleton-opaque-range-contract.patch
          git apply fieldwork/host-singleton-suspense-opaque-fallback-contract.patch
          git apply fieldwork/host-singleton-body-scope-sibling-contract.patch
          git apply fieldwork/host-singleton-opaque-parser-compat.patch
      - name: Validate singleton harness and parser compatibility
        run: >-
          yarn test --dev ReactDOMSingletonComponents-test
          --testNamePattern="updates dangerouslySetInnerHTML on a singleton|keeps scripts inert when body uses dangerouslySetInnerHTML"
      - name: Validate Trusted Types compatibility
        run: >-
          yarn test --dev trustedTypes-test.internal
          --testNamePattern="should not stringify trusted values for body singleton direct HTML"
      - name: Validate document-placement harness with existing passing behavior
        run: >-
          yarn test --dev ReactDOM-test
          --testNamePattern="should render root host components into body scope when the container is a Document|can render a Suspense boundary above the <html> tag"
      - name: Validate changed test files
        run: yarn linc
      - name: Require current source to reproduce direct-content ownership gaps
        shell: bash
        run: |
          set -u
          expect_current_failure() {
            local pattern="$1"
            echo "Expecting untouched current source to fail: $pattern"
            if yarn test --dev ReactDOMSingletonComponents-test --testNamePattern="$pattern"; then
              echo "Unexpected pass for current-source ownership control: $pattern"
              exit 1
            fi
          }

          expect_current_failure "preserves outside body style during initial direct HTML acquisition"
          expect_current_failure "preserves outside body style during direct HTML update"
          expect_current_failure "preserves outside body style when managed children become direct HTML"
          expect_current_failure "keeps outside body styles around the same slot when direct HTML becomes managed children"
          expect_current_failure "preserves later outside body style when releasing empty direct HTML"
          expect_current_failure "removes opaque owned style while preserving outside style"
          expect_current_failure "preserves outside body style added before hydrating opaque HTML"
      - name: Require current source to reproduce document-owner ownership gaps
        shell: bash
        run: |
          set -u
          expect_current_failure() {
            local pattern="$1"
            echo "Expecting untouched current source to fail: $pattern"
            if yarn test --dev ReactDOM-test --testNamePattern="$pattern"; then
              echo "Unexpected pass for current-source document ownership control: $pattern"
              exit 1
            fi
          }

          expect_current_failure "preserves primary document children across an opaque body fallback"
          expect_current_failure "keeps body direct HTML ordered between root body-scope siblings"
          expect_current_failure "keeps managed body children ordered when the body slot becomes opaque"
