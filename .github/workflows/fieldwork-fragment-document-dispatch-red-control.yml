name: Fieldwork Fragment document dispatch red control

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  focused-red-control:
    if: >-
      github.repository == 'teamleaderleo/react' &&
      github.event.pull_request.head.ref == 'research/fragment-document-dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fragment-document-dispatch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Focused Document dispatch regression
        run: yarn test --dev ReactDOMFragmentRefsDocumentDispatch-test --runInBand
