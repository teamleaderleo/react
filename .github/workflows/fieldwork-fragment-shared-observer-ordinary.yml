name: Fieldwork Fragment shared observer ownership probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  focused-probe:
    if: >-
      github.repository == 'teamleaderleo/react' &&
      github.event.pull_request.head.ref == 'research/fragment-shared-observer-ordinary'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fragment-shared-observer-ordinary
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Shared observer ownership probe
        run: >-
          yarn test --dev
          ReactDOMFragmentRefsSharedObserver-test
          ReactDOMFragmentRefs-test
          --runInBand
