name: Fieldwork HostSingleton reacquire experiment

on:
  push:
    branches:
      - research/host-singleton-reacquire-provenance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight candidate patch
        run: git apply --check fieldwork/host-singleton-reacquire-provenance.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply candidate and run focused gates
        run: bash fieldwork/verify-host-singleton-reacquire-provenance.sh
