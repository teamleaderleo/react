name: Fieldwork HostSingleton preamble client owner

on:
  pull_request:
    branches:
      - research/host-singleton-preamble-ownership
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-owner-reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight contract patches
        run: |
          git apply --check fieldwork/host-singleton-preamble-ownership-contract.patch
          git apply --check fieldwork/host-singleton-preamble-real-owner-contract.patch
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Apply synthetic and real-Fizz ownership controls
        run: |
          git apply fieldwork/host-singleton-preamble-ownership-contract.patch
          git apply fieldwork/host-singleton-preamble-real-owner-contract.patch
      - name: Require real Fizz takeover to restore body event ownership on current source
        run: >-
          yarn test --dev ReactDOMFizzServer-test
          --testNamePattern="keeps body event props after a real preamble boundary client takeover"
      - name: Confirm the synthetic marker arrangement still exposes detach behavior
        shell: bash
        run: |
          set -u
          pattern="keeps the current singleton event props after clearing a preamble contribution"
          if yarn test --dev ReactDOMSingletonComponents-test --testNamePattern="$pattern"; then
            echo "Synthetic marker control unexpectedly passed; inspect the lifecycle assumptions."
            exit 1
          fi
      - name: Lint verifier
        run: yarn linc
